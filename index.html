<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <title>เกมพิชิตสี่แยกมรณะ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- TensorFlow.js & Teachable Machine Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.3/dist/teachablemachine-pose.min.js"></script>
</head>

<body>
  <div class="app">
    <div class="header">
      <img src="rules.png" />

    </div>
    <div class="right-column">
      <div class="panel" style="margin-bottom: 20px;">
        <h2 class="panel-title"> ควบคุมระบบ</h2>
        <div class="button-row">
          <button id="loadBtn" type="button" onclick="loadModel()">โหลดโมเดล</button>
          <button id="cameraBtn" type="button" onclick="startCamera()" disabled>เปิดกล้อง</button>
          <button id="stopBtn" type="button" onclick="stopCamera()" disabled>หยุดกล้อง</button>
        </div>
      </div>
    </div>

    <div class="dashboard">
      <!-- คอลัมน์ซ้าย: กล้อง / พรีวิว -->
      <div class="panel camera-panel">
        <h2 class="panel-title"> กล้องผู้เล่น</h2>

        <div class="preview-wrap">
          <canvas id="webcamCanvas" width="400" height="400"></canvas>
          <img id="previewImage" alt="preview" />
        </div>
      </div>

      <!-- คอลัมน์กลาง: ตัวเกมหลัก Canvas -->
      <div class="panel game-panel">
        <div class="game-hud">
          <div>time: <span id="gameTimer">01.00</span></div>
          <div>รถผ่าน: <span id="passedCars">0</span></div>
          <div>สัญญาณ: <span id="currentSignal" style="color: #ef4444;">ALL STOP</span></div>
          <button id="startBtn" onclick="startGame()"
            style="background: transparent; border: none; outline: none; box-shadow: none; padding: 0; cursor: pointer;">
            <img src="start_0.png" alt="เริ่มเกม"
              style="height: 60px; display: block; border: none; background: transparent;" />
          </button>
        </div>

        <canvas id="gameCanvas" width="650" height="650"></canvas>

        <div id="gameOverlay" class="overlay hidden">
          <div class="overlay-content">
            <h2 id="overlayTitle">Defeated!</h2>
            <p id="overlaySub">รถผ่านไปได้เพียง: 0 คัน</p>
            <button onclick="restartGame()">เล่นใหม่อีกครั้ง</button>
          </div>
        </div>
      </div>
    </div>

    <!-- คอลัมน์ขวา: แผงควบคุมและ Class Score -->
    <div class="right-column">

      <div class="result-card">
        <div id="result">ผลลัพธ์: -</div>
        <div id="confidence">ความมั่นใจ: -</div>
        <div id="action">สถานะ: ยังไม่ได้โหลดโมเดล</div>
      </div>

      <div class="panel">
        <h2 class="panel-title">คะแนนแต่ละ Class</h2>

        <div class="score-list" id="scoreList">
          <div class="hint" style="text-align: center;">กรุณาโหลดโมเดลเพื่อแสดง Class</div>
        </div>
      </div>
    </div>
  </div>
  <!-- กล่องแจ้งเตือนเมื่อจบเกม/ชนะเกม -->
  <div id="gameOverlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="overlayTitle">Victory!</h2>
      <p id="overlaySub">คุณผ่านสี่แยกมรณะโดยสวัสดิภาพ</p>
      <button id="overlayBtn" onclick="restartGame()">เล่นใหม่อีกครั้ง</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
